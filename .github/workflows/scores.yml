name: Scores

# Récupère les résultats et prochains matchs d'Ixelles sur hockey.be (scripts/fetch-matches.mjs).
# S'il y a du nouveau, enregistre sur main puis relance le déploiement.
# Lancement manuel uniquement : hockey.be (Cloudflare) refuse les adresses des serveurs GitHub (403).
# La récupération régulière est faite par une tâche Claude planifiée qui lance le même script.

on:
  workflow_dispatch:

concurrency:
  group: scores
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/fetch-matches.mjs
      - name: Enregistrer et redéployer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain src/content/matches)" ]; then
            echo "Rien de nouveau."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/content/matches
          git commit -m "Scores : mise à jour depuis hockey.be"
          git push origin HEAD:main
          # Un push fait avec GITHUB_TOKEN ne déclenche pas « Deploy » tout seul.
          gh workflow run deploy.yml --ref main
